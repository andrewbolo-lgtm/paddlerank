<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pickleball Rec Play Manager</title>
    
    <!-- Cache-busted Favicon & Mobile App Icon -->
    <link rel="icon" type="image/png" href="./PRPM.png?v=2">
    <link rel="apple-touch-icon" href="./PRPM.png?v=2">

    <!-- Tailwind CSS with Custom PRPM Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        prpm: {
                            navy: '#034160',    /* Deep Navy Teal */
                            mint: '#15F9B7',    /* Electric Mint */
                            cyan: '#0CA5E2',    /* Vibrant Cyan Blue */
                            ice: '#BBE9FA'      /* Ice Blue / Mist */
                        },
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        indigo: { 500: '#0CA5E2', 600: '#0CA5E2', 700: '#034160' },
                        emerald: { 500: '#15F9B7', 600: '#10d99e' }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #ffffff;
        }
        /* Hardware-accelerated, targeted transitions to prevent scroll jank */
        button, input, select {
            transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
        }
        button:active { transform: scale(0.98); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Contain layout paints on heavy lists */
        #benchRosterList, #playersList, #historyContainer { contain: content; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="bg-white text-prpm-navy h-screen flex overflow-hidden">

    <!-- Desktop Sidebar (Deep Navy Teal #034160) -->
    <aside class="w-64 bg-prpm-navy text-white flex-col shadow-xl z-10 hidden md:flex">
        <div class="p-4 flex items-center justify-center border-b border-prpm-cyan/25">
            <img src="./PRPM.png?v=2" alt="Pickleball Rec Play Manager" class="w-44 h-auto object-contain">
        </div>
        <nav class="flex-1 p-4 space-y-2" id="nav-menu">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 bg-prpm-cyan rounded-lg shadow-sm text-white font-semibold text-left">
                📋 Dashboard
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg text-prpm-ice font-medium text-left">
                ⏱️ Match History
            </button>
            <button onclick="switchTab('players')" id="nav-players" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg text-prpm-ice font-medium text-left">
                👥 Players DB
            </button>
            <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg text-prpm-ice font-medium text-left">
                🏆 Leaderboard
            </button>
        </nav>
    </aside>

    <!-- Main Content Area (Clean White #FFFFFF Background) -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto no-scrollbar pb-16 md:pb-0 relative bg-white">
        
        <!-- QM Command Header -->
        <header class="bg-white border-b border-prpm-ice px-3 py-3 sticky top-0 z-20 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center gap-2.5">

                <h2 id="pageTitle" class="text-lg md:text-xl font-bold text-prpm-navy tracking-tight">Match Dashboard</h2>
            </div>
            <div id="qmControls" class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <div class="flex items-center gap-1.5 bg-prpm-ice/35 px-2 py-1 rounded-lg border border-prpm-ice shrink-0">
                    <span class="text-[10px] font-bold text-prpm-navy uppercase">Courts</span>
                    <button onclick="changeCourtCount(-1)" class="w-6 h-6 flex items-center justify-center rounded bg-white border border-prpm-ice font-bold text-prpm-navy shadow-sm">-</button>
                    <span id="courtCountDisplay" class="w-4 text-center font-extrabold text-prpm-cyan text-sm">3</span>

                    <button id="btn-doubles" onclick="setMatchType('doubles')" class="px-3 py-1.5 rounded bg-white text-prpm-cyan font-bold shadow-sm">2v2</button>
                    <button id="btn-singles" onclick="setMatchType('singles')" class="px-3 py-1.5 rounded text-prpm-navy/70">1v1</button>
                </div>

                <button onclick="fillOpenCourts()" class="flex-1 sm:flex-none bg-prpm-cyan hover:bg-prpm-navy text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-sm active:scale-95">
                    Fill Courts
                </button>
            </div>
        </header>

        <div class="p-3 md:p-6 pb-20 bg-white">
            
            <!-- DASHBOARD VIEW -->
            <div id="view-dashboard" class="view-section active max-w-4xl mx-auto space-y-4">
                
                <!-- Active Courts -->
                <section>
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-xs font-extrabold uppercase tracking-wider text-prpm-navy/70">Live Courts</h2>
                        <button onclick="toggleSessionMeta()" class="text-xs font-semibold text-prpm-cyan hover:text-prpm-navy">Session Info ▾</button>
                    </div>

                    <div id="sessionMetaDrawer" class="hidden bg-white p-3 rounded-xl border border-prpm-ice mb-3 grid grid-cols-1 sm:grid-cols-3 gap-2 shadow-sm">
                        <input type="text" id="sessionName" onchange="saveData()" placeholder="Session Name" class="bg-white border border-prpm-ice rounded-lg px-3 py-2 text-sm text-prpm-navy focus:outline-none focus:border-prpm-cyan">
                        <input type="date" id="sessionDate" onchange="saveData()" class="bg-white border border-prpm-ice rounded-lg px-3 py-2 text-sm text-prpm-navy focus:outline-none focus:border-prpm-cyan">
                        <input type="text" id="sessionLocation" onchange="saveData()" placeholder="Location" class="bg-white border border-prpm-ice rounded-lg px-3 py-2 text-sm text-prpm-navy focus:outline-none focus:border-prpm-cyan">

                    <div id="activeCourtsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">

                <!-- On Deck -->

            </div>

    <script>
        // --- 1. ZERO DEPENDENCY & RESILIENT STORAGE ENGINE ---
        let players = []; 
        let historicalMatches = []; 
        let sessionMatches = [];
        let activeCourts = [];
        let numCourts = 3;
        let matchType = 'doubles';
        let playSequence = 1;
        let benchFilter = 'checked';
        let activeTab = 'dashboard';
        let leaderboardMode = 'global';
        let editingPlayerId = null;

        const STARTING_RATING = 3.500;
        const BASE_K = 0.1; 
        const VERIFIED_K = 0.02; 
        const WEIGHTS = { WAIT_INDEX: 1.8, REPEAT_PARTNER: 12.0, REPEAT_OPP: 4.0, RATING_GAP: 6.5 };

        function esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function uid() { return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`; }

        let saveTimer = null;
        function saveData(immediate = false) {
            const persist = () => {
                const payload = {
                    version: 2, players, historicalMatches, sessionMatches, activeCourts, numCourts, matchType, playSequence,
                    sessionName: document.getElementById('sessionName').value,
                    sessionDate: document.getElementById('sessionDate').value,
                    sessionLocation: document.getElementById('sessionLocation').value
                };
                try { localStorage.setItem('paddleRankData', JSON.stringify(payload)); }
                catch(e) { console.error(e); alert('Storage error. Backup data immediately via CSV.'); }
            };
            clearTimeout(saveTimer);
            if (immediate) persist(); else saveTimer = setTimeout(persist, 250);
        }

        function loadData() {
            const raw = localStorage.getItem('paddleRankData');
            const dEl = document.getElementById('sessionDate');
            if(!raw) { if(dEl) dEl.valueAsDate = new Date(); syncCourtSlots(); return; }
            try {
                const d = JSON.parse(raw);
                players = d.players || [];
                historicalMatches = d.historicalMatches || [];
                sessionMatches = d.sessionMatches || [];
                activeCourts = d.activeCourts || [];
                numCourts = d.numCourts || 3;
                matchType = d.matchType || 'doubles';
                playSequence = d.playSequence || 1;
                
                if(d.sessionName) document.getElementById('sessionName').value = d.sessionName;
                if(d.sessionLocation) document.getElementById('sessionLocation').value = d.sessionLocation;
                if(d.sessionDate && dEl) dEl.value = d.sessionDate; else if(dEl) dEl.valueAsDate = new Date();
                
                // Set default player state to 'ready'
                players.forEach(p => { if (!p.sessionState || p.sessionState === 'out') p.sessionState = 'ready'; });
                
                setMatchType(matchType, false);
                document.getElementById('courtCountDisplay').textContent = numCourts;
                syncCourtSlots();
            } catch(e) {
                localStorage.setItem(`paddleRankData_backup_${Date.now()}`, raw);
                if(dEl) dEl.valueAsDate = new Date();
                syncCourtSlots();
            }
        }

        // --- 2. MATCHMAKING & CONTINUOUS ROTATION ENGINE ---
        function syncCourtSlots() {
            while (activeCourts.length < numCourts) activeCourts.push({ courtNum: activeCourts.length + 1, match: null });
            if (activeCourts.length > numCourts) {
                for (let i = activeCourts.length - 1; i >= numCourts; i--) {
                    if (!activeCourts[i].match) activeCourts.splice(i, 1);
                }
            }
        }

        function getPlayingPlayerIds(excludeCourtNum = null) {
            const ids = new Set();
            for (const c of activeCourts) {
                if (c.match && c.courtNum !== excludeCourtNum) {
                    c.match.t1Ids.forEach(id => ids.add(id));
                    c.match.t2Ids.forEach(id => ids.add(id));
                }
            }
            return ids;
        }

        function buildSessionHistoryMatrices() {
            const pMap = new Map(), oMap = new Map();
            const key = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
            const inc = (map, a, b) => map.set(key(a, b), (map.get(key(a, b)) || 0) + 1);

            const relevant = [...sessionMatches, ...activeCourts.map(c => c.match).filter(Boolean)];
            for (const m of relevant) {
                if (m.t1Ids.length === 2) inc(pMap, m.t1Ids[0], m.t1Ids[1]);
                if (m.t2Ids.length === 2) inc(pMap, m.t2Ids[0], m.t2Ids[1]);
                for (const p1 of m.t1Ids) for (const p2 of m.t2Ids) inc(oMap, p1, p2);
            }
            return { getP: (a,b) => pMap.get(key(a,b))||0, getO: (a,b) => oMap.get(key(a,b))||0 };
        }

        function selectOptimalMatch(excludedIds, virtualGames = new Map(), virtualWait = new Map()) {
            const size = matchType === 'doubles' ? 4 : 2;
            const eligible = players.filter(p => p.sessionState === 'ready' && !excludedIds.has(p.id));
            if (eligible.length < size) return null;

            const ranked = [...eligible].sort((a, b) => {
                const gA = (a.sessionMatches || 0) + (virtualGames.get(a.id) || 0);
                const gB = (b.sessionMatches || 0) + (virtualGames.get(b.id) || 0);
                if (gA !== gB) return gA - gB;
                const wA = virtualWait.get(a.id) ?? (a.lastPlayedOrder || 0);
                const wB = virtualWait.get(b.id) ?? (b.lastPlayedOrder || 0);
                if (wA !== wB) return wA - wB;
                return Math.random() - 0.5;
            });

            const pool = ranked.slice(0, size === 4 ? 8 : 6);
            const { getP, getO } = buildSessionHistoryMatrices();
            let best = null, minCost = Infinity;

            const evaluate = (t1, t2, wCost) => {
                let sCost = 0;
                if (t1.length === 2) sCost += WEIGHTS.REPEAT_PARTNER * getP(t1[0].id, t1[1].id);
                if (t2.length === 2) sCost += WEIGHTS.REPEAT_PARTNER * getP(t2[0].id, t2[1].id);
                for (const a of t1) for (const b of t2) sCost += WEIGHTS.REPEAT_OPP * getO(a.id, b.id);
                
                const r1 = t1.reduce((s,p) => s + (p.rating||3.5), 0) / t1.length;
                const r2 = t2.reduce((s,p) => s + (p.rating||3.5), 0) / t2.length;
                const total = wCost + sCost + (WEIGHTS.RATING_GAP * Math.abs(r1 - r2));
                
                if (total < minCost) { minCost = total; best = { t1, t2 }; }
            };

            if (size === 4) {
                for(let i=0; i<pool.length-3; i++) for(let j=i+1; j<pool.length-2; j++)
                for(let k=j+1; k<pool.length-1; k++) for(let l=k+1; l<pool.length; l++) {
                    const wCost = WEIGHTS.WAIT_INDEX * (i+j+k+l);
                    const [p0,p1,p2,p3] = [pool[i],pool[j],pool[k],pool[l]];
                    evaluate([p0,p1],[p2,p3],wCost); evaluate([p0,p2],[p1,p3],wCost); evaluate([p0,p3],[p1,p2],wCost);
                }
            } else {
                for(let i=0; i<pool.length-1; i++) for(let j=i+1; j<pool.length; j++) evaluate([pool[i]],[pool[j]], WEIGHTS.WAIT_INDEX*(i+j));
            }
            if(!best) return null;
            return { id: uid(), type: matchType, t1Ids: best.t1.map(p=>p.id), t2Ids: best.t2.map(p=>p.id), score1: null, score2: null };
        }

        function fillOpenCourts(specNum = null) {
            syncCourtSlots();
            let assigned = 0;
            for (const slot of activeCourts) {
                if (specNum !== null && slot.courtNum !== specNum) continue;
                if (slot.match) continue;
                const match = selectOptimalMatch(getPlayingPlayerIds());
                if (!match) break;
                slot.match = match;
                assigned++;
            }
            if(assigned===0 && specNum!==null) alert("Not enough Ready players on bench.");
            saveData(true); renderApp();
        }

        function reshuffleCourt(courtNum) {
            const slot = activeCourts.find(c => c.courtNum === courtNum);
            if(!slot) return;
            const replacement = selectOptimalMatch(getPlayingPlayerIds(courtNum));
            if(!replacement) { alert('No alternative players ready.'); return; }
            slot.match = replacement;
            saveData(true); renderApp();
        }

        function getOnDeckQueue(max = 2) {
            const busy = getPlayingPlayerIds();
            const vG = new Map(), vW = new Map(), q = [];
            for (let i = 0; i < max; i++) {
                const m = selectOptimalMatch(busy, vG, vW);
                if (!m) break;
                q.push(m);
                [...m.t1Ids, ...m.t2Ids].forEach(id => { busy.add(id); vG.set(id, (vG.get(id)||0)+1); vW.set(id, playSequence+i+1); });
            }
            return q;
        }

        function submitCourtScore(courtNum) {
            const slot = activeCourts.find(c => c.courtNum === courtNum);
            if (!slot || !slot.match) return;
            const m = slot.match;
            const s1 = parseInt(document.getElementById(`score1-${courtNum}`).value);
            const s2 = parseInt(document.getElementById(`score2-${courtNum}`).value);
            if (isNaN(s1) || isNaN(s2) || s1 < 0 || s2 < 0 || s1 === s2) { alert('Enter valid non-tied scores.'); return; }

            const getR = ids => ids.reduce((s, id) => s + (players.find(x=>x.id===id)?.rating||3.5), 0)/ids.length;
            const expected = 1 / (1 + Math.pow(10, (getR(m.t2Ids) - getR(m.t1Ids)) / 1.25));
            const actual = s1 > s2 ? 1 : 0;
            const pdMult = 1 + (Math.min(Math.abs(s1 - s2), 11) / 11);

            playSequence++;
            const apply = (ids, exp, act, pd) => {
                ids.forEach(id => {
                    const p = players.find(x=>x.id===id); if(!p) return;
                    const delta = (p.verified ? VERIFIED_K : BASE_K) * pdMult * (act - exp);
                    p.rating = Math.min(8.0, Math.max(2.0, p.rating + delta));
                    p.matchesPlayed = (p.matchesPlayed||0)+1;
                    p.sessionMatches = (p.sessionMatches||0)+1;
                    p.sessionWins = (p.sessionWins||0) + act;
                    p.sessionPointDiff = (p.sessionPointDiff||0) + pd;
                    p.lastPlayedOrder = playSequence;
                });
            };
            apply(m.t1Ids, expected, actual, s1 - s2);
            apply(m.t2Ids, 1 - expected, 1 - actual, s2 - s1);
            
            m.score1 = s1; m.score2 = s2;
            m.sessionName = document.getElementById('sessionName').value || 'Open Play';
            m.sessionDate = document.getElementById('sessionDate').value || '';
            sessionMatches.push(m);
            historicalMatches.push(m);
            slot.match = null;
            fillOpenCourts(courtNum);
        }

        // --- 4. CSV (RFC4180) & DATA MGMT ---
        function csvEscape(val) { const s = String(val??''); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
        function parseCSV(line) {
            const out = []; let cur = '', inQ = false;
            for(let i=0; i<line.length; i++) {
                const c = line[i];
                if(inQ) { if(c==='"' && line[i+1]==='"') { cur+='"'; i++; } else if(c==='"') inQ=false; else cur+=c; }
                else { if(c==='"') inQ=true; else if(c===',') { out.push(cur); cur=''; } else cur+=c; }
            }
            out.push(cur); return out;
        }

        function exportCSV() {
            const lines = ['---PLAYERS---', 'ID,Name,Rating,MatchesPlayed,Verified,Paid',
                ...players.map(p => [csvEscape(p.id), csvEscape(p.name), (p.rating||3.5).toFixed(3), p.matchesPlayed||0, !!p.verified, !!p.paid].join(',')),
                '---MATCHES---', 'ID,SessionName,SessionDate,Type,T1,T2,Score1,Score2',
                ...historicalMatches.map(m => [csvEscape(m.sessionName), csvEscape(m.sessionDate), csvEscape(m.type), csvEscape(m.t1Ids.join('|')), csvEscape(m.t2Ids.join('|')), m.score1, m.score2].join(','))];
            const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = `PRPM_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            setTimeout(()=>URL.revokeObjectURL(url),1000);
        }

        function importCSV(e) {
            const file = e.target.files[0]; if(!file) return;
            const r = new FileReader();
            r.onload = ev => {
                const rows = ev.target.result.split(/\r?\n/);
                let mode = 'PLAYERS', pC = 0, mC = 0;
                for(const r of rows) {
                    const row = r.trim(); if(!row) continue;
                    if(row==='---PLAYERS---'){mode='PLAYERS'; continue;} if(row==='---MATCHES---'){mode='MATCHES'; continue;}
                    if(row.startsWith('ID,Name') || row.startsWith('ID,Session')) continue;
                    const c = parseCSV(row);
                    if(mode==='PLAYERS' && c.length>=5) {
                        const existing = players.find(x=>x.id===c[0]);
                        if(existing) { existing.name=c[1]; existing.rating=parseFloat(c[2])||3.5; existing.matchesPlayed=parseInt(c[3])||0; existing.verified=c[4]==='true'; }
                        else { players.push({ id:c[0]||uid(), name:c[1], rating:parseFloat(c[2])||3.5, matchesPlayed:parseInt(c[3])||0, verified:c[4]==='true', sessionState:'ready', paid:false, sessionMatches:0, sessionWins:0, sessionPointDiff:0 }); }
                        pC++;
                    } else if(mode==='MATCHES' && c.length>=8) {
                        historicalMatches.push({ sessionName:c[1], sessionDate:c[2], type:c[3], t1Ids:c[4].split('|'), t2Ids:c[5].split('|'), score1:parseInt(c[6]), score2:parseInt(c[7]) });
                        mC++;
                    }
                }
                e.target.value=''; saveData(true); renderApp(); alert(`Imported ${pC} players, ${mC} matches.`);
            }; r.readAsText(file);
        }

        function renderBenchDrawer() {

            else if (benchFilter === 'resting') pool = pool.filter(p => p.sessionState === 'resting');
            else if (benchFilter === 'unpaid') pool = pool.filter(p => p.sessionState !== 'out' && !p.paid);
            if (fStr) pool = pool.filter(p => p.name.toLowerCase().includes(fStr));

            pool.sort((a, b) => {
                if (a.sessionState !== b.sessionState) return a.sessionState === 'ready' ? -1 : 1;
                return (a.lastPlayedOrder || 0) - (b.lastPlayedOrder || 0);
            });

            const attendees = players.filter(p => p.sessionState !== 'out');
            document.getElementById('paidSummaryBadge').textContent = `Paid: ${attendees.filter(p=>p.paid).length}/${attendees.length}`;

                    <div class="flex items-center justify-between py-2 sm:px-2 hover:bg-prpm-ice/15 transition-colors">
                        <div class="flex flex-col">
                            <span class="text-xs sm:text-sm font-bold text-prpm-navy">${esc(p.name)} ${p.verified?'🔵':''}</span>
                            <span class="text-[10px] font-bold text-prpm-navy/60">R: ${p.rating.toFixed(3)} | ${p.sessionMatches||0}g</span>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${paidBtn}
                            ${stateBtn}
                        </div>
                    </div>`;
            }).join('');
        }

        function renderPlayers() {
            const list = document.getElementById('playersList');
            if(players.length === 0) { list.innerHTML = '<li class="p-4 text-prpm-navy/50 text-center text-sm">No players in database.</li>'; return; }
            list.innerHTML = players.map(p => `
                <li class="p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-prpm-ice/15 gap-2 sm:gap-0">
                    <div class="flex items-center gap-3">
                        <div class="h-8 w-8 rounded-full bg-prpm-navy flex items-center justify-center text-prpm-mint font-bold text-sm shrink-0">${p.name.charAt(0).toUpperCase()}</div>
                        <span class="font-bold text-sm sm:text-base text-prpm-navy">${esc(p.name)} ${p.verified?'🔵':''}</span>
                    </div>
                    <div class="flex items-center gap-4 justify-between sm:justify-end ml-11 sm:ml-0">
                        <span class="text-[10px] sm:text-xs font-bold text-prpm-navy/60 tracking-wide uppercase">Rating: <span class="text-prpm-cyan">${p.rating.toFixed(3)}</span></span>
                        <div class="flex items-center gap-1">
                            <button onclick="openEditModal('${p.id}')" class="text-prpm-navy hover:bg-prpm-cyan hover:text-white bg-prpm-ice/40 px-2 py-1 rounded font-bold text-[10px] sm:text-xs">Edit</button>
                            <button onclick="deletePlayer('${p.id}')" class="text-prpm-navy/70 hover:text-red-600 bg-prpm-ice/40 px-2 py-1 rounded font-bold text-[10px] sm:text-xs">Del</button>
                        </div>
                    </div>
                </li>`).join('');
        }

        function renderLeaderboard() {
            const tHead = document.getElementById('leaderboardHead');
            const tBody = document.getElementById('leaderboardBody');

            if (leaderboardMode === 'global') {
                tHead.innerHTML = `
                    <tr class="text-xs font-bold text-prpm-navy uppercase bg-prpm-ice/20 border-b border-prpm-ice">
                        <th class="px-4 py-3">Rank</th>
                        <th class="px-4 py-3">Player</th>
                        <th class="px-4 py-3 text-center">Rating</th>
                        <th class="px-4 py-3 text-center">Matches</th>
                    </tr>`;
                
                tBody.innerHTML = [...players].sort((a,b)=>b.rating-a.rating).map((p,i) => `
                    <tr class="hover:bg-prpm-ice/15 transition-colors">
                        <td class="px-4 py-3 text-prpm-navy/60 font-bold text-sm">#${i+1}</td>
                        <td class="px-4 py-3 font-bold text-sm text-prpm-navy">${(i===0&&p.matchesPlayed>0)?'👑 ':''}${esc(p.name)} ${p.verified?'🔵':''}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-prpm-ice/50 text-prpm-navy px-2.5 py-1 rounded-full text-xs font-extrabold">${p.rating.toFixed(3)}</span></td>
                        <td class="px-4 py-3 text-center text-prpm-navy/70 text-sm font-bold">${p.matchesPlayed||0}</td>
                    </tr>`).join('');
            } else {
                tHead.innerHTML = `
                    <tr class="text-xs font-bold text-prpm-navy uppercase bg-prpm-ice/20 border-b border-prpm-ice">
                        <th class="px-4 py-3">Rank</th>
                        <th class="px-4 py-3">Player</th>
                        <th class="px-4 py-3 text-center">W-L</th>
                        <th class="px-4 py-3 text-center">Pt Diff</th>
                    </tr>`;
                
                const sessionPlayers = players.filter(p => (p.sessionMatches || 0) > 0 || p.sessionState !== 'out');
                if (sessionPlayers.length === 0) {
                    tBody.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-prpm-navy/50 text-sm">No active players in current session.</td></tr>`;
                    return;
                }
                
                sessionPlayers.sort((a, b) => {
                    const winsA = a.sessionWins || 0;
                    const winsB = b.sessionWins || 0;
                    if (winsA !== winsB) return winsB - winsA;
                    const pdA = a.sessionPointDiff || 0;
                    const pdB = b.sessionPointDiff || 0;
                    return pdB - pdA;
                });

                tBody.innerHTML = sessionPlayers.map((p,i) => {
                    const w = p.sessionWins || 0;
                    const l = (p.sessionMatches || 0) - w;
                    const pd = p.sessionPointDiff || 0;
                    const pdStr = pd > 0 ? `+${pd}` : `${pd}`;
                    const pdColor = pd > 0 ? 'text-prpm-cyan' : (pd < 0 ? 'text-red-500' : 'text-prpm-navy/60');
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
                    
                    return `
                    <tr class="hover:bg-prpm-ice/15 transition-colors">
                        <td class="px-4 py-3 text-prpm-navy/60 font-bold text-sm">${medal}</td>
                        <td class="px-4 py-3 font-bold text-sm text-prpm-navy">${esc(p.name)} ${p.verified?'🔵':''}</td>
                        <td class="px-4 py-3 text-center font-bold text-prpm-navy">${w} - ${l}</td>
                        <td class="px-4 py-3 text-center text-sm font-extrabold ${pdColor}">${pdStr}</td>
                    </tr>`;
                }).join('');
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if(historicalMatches.length === 0) { container.innerHTML = '<div class="text-center text-prpm-navy/50 py-10 text-sm">No match history.</div>'; return; }
            const groups = {};
            historicalMatches.forEach(m => {
                const k = `${m.sessionName||'Open Play'}::${m.sessionDate||''}`;
                if(!groups[k]) groups[k] = []; groups[k].push(m);
            });
            
            container.innerHTML = Object.keys(groups).map(k => {
                const [n, d] = k.split('::');
                const matches = groups[k];
                
                let pStats = {};
                matches.forEach(m => {
                    const pd = m.score1 - m.score2;
                    const process = (ids, w, ptDiff) => {
                        ids.forEach(id => {
                            if(!pStats[id]) pStats[id] = { id, w: 0, m: 0, pd: 0 };
                            pStats[id].m++;
                            pStats[id].w += w;
                            pStats[id].pd += ptDiff;
                        });
                    };
                    process(m.t1Ids, m.score1 > m.score2 ? 1 : 0, pd);
                    process(m.t2Ids, m.score2 > m.score1 ? 1 : 0, -pd);
                });
                
                const sortedRecap = Object.values(pStats).sort((a,b) => {
                    if(b.w !== a.w) return b.w - a.w;
                    return b.pd - a.pd;
                });
                
                const recapHtml = sortedRecap.map((p, i) => {
                    const w = p.w;
                    const l = p.m - w;
                    const pdStr = p.pd > 0 ? `+${p.pd}` : `${p.pd}`;
                    const pdColor = p.pd > 0 ? 'text-prpm-cyan' : (p.pd < 0 ? 'text-red-500' : 'text-prpm-navy/60');
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
                    return `
                    <tr class="hover:bg-prpm-ice/15 transition-colors">
                        <td class="px-4 py-2 text-prpm-navy/60 font-bold text-xs sm:text-sm">${medal}</td>
                        <td class="px-4 py-2 font-bold text-xs sm:text-sm text-prpm-navy">${nameBadge(p.id)}</td>
                        <td class="px-4 py-2 text-center font-bold text-prpm-navy text-xs sm:text-sm">${w} - ${l}</td>
                        <td class="px-4 py-2 text-center text-xs sm:text-sm font-extrabold ${pdColor}">${pdStr}</td>
                    </tr>`;
                }).join('');
                
                const matchesHtml = matches.map((m) => `
                    <div class="bg-white rounded-lg p-3 flex justify-between items-center text-xs sm:text-sm border border-prpm-ice">
                        <div class="${m.score1>m.score2?'font-bold text-prpm-navy':'text-prpm-navy/50'} flex-1 text-right">${m.t1Ids.map(nameBadge).join('<br class="sm:hidden"><span class="hidden sm:inline"> & </span>')}</div>
                        <div class="px-2 sm:px-3 font-mono font-extrabold text-prpm-cyan text-sm sm:text-base shrink-0">${m.score1} - ${m.score2}</div>
                        <div class="${m.score2>m.score1?'font-bold text-prpm-navy':'text-prpm-navy/50'} flex-1">${m.t2Ids.map(nameBadge).join('<br class="sm:hidden"><span class="hidden sm:inline"> & </span>')}</div>
                    </div>
                `).join('');
                
                return `
                    <div class="mb-4 bg-white border border-prpm-ice rounded-xl shadow-sm overflow-hidden">
                        <details class="group">
                            <summary class="flex items-center justify-between p-4 cursor-pointer bg-prpm-ice/25 hover:bg-prpm-ice/40 transition-colors list-none [&::-webkit-details-marker]:hidden">
                                <div>
                                    <h4 class="font-bold text-prpm-navy text-base flex items-center gap-2"><span>📅</span> ${esc(n)}</h4>
                                    <span class="text-xs font-bold text-prpm-navy/60">${esc(d)}</span>
                                </div>
                                <span class="text-prpm-cyan group-open:rotate-180 transition-transform text-lg">▼</span>
                            </summary>
                            <div class="p-4 border-t border-prpm-ice space-y-6 bg-white">
                                <div>
                                    <h5 class="text-[10px] sm:text-xs font-extrabold text-prpm-navy/70 uppercase tracking-wider mb-3">🏆 Session Leaderboard</h5>
                                    <div class="overflow-x-auto border border-prpm-ice rounded-lg">
                                        <table class="w-full text-left border-collapse min-w-full">
                                            <thead>
                                                <tr class="text-[10px] sm:text-xs font-bold text-prpm-navy uppercase bg-prpm-ice/20 border-b border-prpm-ice">
                                                    <th class="px-4 py-2">Rank</th>
                                                    <th class="px-4 py-2">Player</th>
                                                    <th class="px-4 py-2 text-center whitespace-nowrap">W-L</th>
                                                    <th class="px-4 py-2 text-center whitespace-nowrap">Pt Diff</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-prpm-ice/60">
                                                ${recapHtml}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div>
                                    <h5 class="text-[10px] sm:text-xs font-extrabold text-prpm-navy/70 uppercase tracking-wider mb-3">⚔️ Match Log</h5>
                                    <div class="space-y-2">
                                        ${matchesHtml}
                                    </div>
                                </div>
                            </div>
                        </details>
                    </div>`;
            }).join('');
        }

        loadData();
    </script>
</body>
</html>
