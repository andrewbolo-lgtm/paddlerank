<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pickleball Rec Play Manager</title>
    
    <!-- Cache-busted Favicon & Mobile App Icon -->
    <link rel="icon" type="image/png" href="./PRPM.png?v=2">
    <link rel="apple-touch-icon" href="./PRPM.png?v=2">

    <!-- Tailwind CSS (Kept for layout integrity, but optimized via CSS overrides below) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 50: '#f8fafc', 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a' },
                        indigo: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        emerald: { 500: '#10b981', 600: '#059669' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Section 1 Fix: Removed external Google Fonts and universal * { transition } */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        /* Hardware-accelerated, targeted transitions to prevent scroll jank */
        button, input, select {
            transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
        }
        button:active { transform: scale(0.98); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Section 1 Fix: Contain layout paints on heavy lists */
        #benchRosterList, #playersList, #historyContainer { contain: content; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

    <!-- Desktop Sidebar -->
    <aside class="w-64 bg-[#053b5c] text-white flex-col shadow-xl z-10 hidden md:flex">
        <div class="p-4 flex items-center justify-center border-b border-sky-900/60">
            <img src="./PRPM.png?v=2" alt="Pickleball Rec Play Manager" class="w-44 h-auto object-contain">
        </div>
        <nav class="flex-1 p-4 space-y-2" id="nav-menu">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 bg-indigo-600 rounded-lg shadow-sm text-white font-medium text-left">
                📋 Dashboard
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-sky-900/60 rounded-lg text-slate-200 font-medium text-left">
                ⏱️ Match History
            </button>
            <button onclick="switchTab('players')" id="nav-players" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-sky-900/60 rounded-lg text-slate-200 font-medium text-left">
                👥 Players DB
            </button>
            <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-sky-900/60 rounded-lg text-slate-200 font-medium text-left">
                🏆 Leaderboard
            </button>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto no-scrollbar pb-16 md:pb-0 relative">
        
        <!-- QM Command Header -->
        <header class="bg-white border-b border-slate-200 px-3 py-3 sticky top-0 z-20 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-center gap-2.5">
                <img src="./PRPM.png?v=2" alt="PRPM" class="h-9 w-9 object-cover rounded-lg bg-[#053b5c] md:hidden shadow-sm">
                <h2 id="pageTitle" class="text-lg md:text-xl font-bold text-slate-800 tracking-tight">Match Dashboard</h2>
            </div>
            <div id="qmControls" class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded-lg border border-slate-200 shrink-0">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">Courts</span>
                    <button onclick="changeCourtCount(-1)" class="w-6 h-6 flex items-center justify-center rounded bg-white border border-slate-300 font-bold text-slate-700 shadow-sm">-</button>
                    <span id="courtCountDisplay" class="w-4 text-center font-extrabold text-indigo-600 text-sm">3</span>
                    <button onclick="changeCourtCount(1)" class="w-6 h-6 flex items-center justify-center rounded bg-white border border-slate-300 font-bold text-slate-700 shadow-sm">+</button>
                </div>

                <div class="bg-slate-100 p-0.5 rounded-lg flex border border-slate-200 text-xs font-semibold shrink-0">
                    <button id="btn-doubles" onclick="setMatchType('doubles')" class="px-3 py-1.5 rounded bg-white text-indigo-600 shadow-sm">2v2</button>
                    <button id="btn-singles" onclick="setMatchType('singles')" class="px-3 py-1.5 rounded text-slate-500">1v1</button>
                </div>

                <button onclick="fillOpenCourts()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow-sm active:scale-95">
                    Fill Courts
                </button>
            </div>
        </header>

        <div class="p-3 md:p-6 pb-20">
            
            <!-- DASHBOARD VIEW -->
            <div id="view-dashboard" class="view-section active max-w-4xl mx-auto space-y-4">
                
                <!-- Active Courts -->
                <section>
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500">Live Courts</h2>
                        <button onclick="toggleSessionMeta()" class="text-xs font-semibold text-indigo-600">Session Info ▾</button>
                    </div>

                    <div id="sessionMetaDrawer" class="hidden bg-white p-3 rounded-xl border border-slate-200 mb-3 grid grid-cols-1 sm:grid-cols-3 gap-2 shadow-sm">
                        <input type="text" id="sessionName" onchange="saveData()" placeholder="Session Name" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500">
                        <input type="date" id="sessionDate" onchange="saveData()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500">
                        <input type="text" id="sessionLocation" onchange="saveData()" placeholder="Location" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div id="activeCourtsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        <!-- Populated by JS -->
                    </div>
                </section>

                <!-- On Deck -->
                <section id="onDeckSection" class="bg-amber-50 border border-amber-200 rounded-xl p-3 shadow-sm">
                    <div class="flex items-center justify-between mb-2">

                    </div>
                    <div id="onDeckList" class="space-y-1.5 text-sm">

                    <div class="flex gap-2">

                        <button onclick="setBenchFilter('resting')" id="filter-resting" class="px-3 py-1 rounded-full bg-slate-100 text-slate-600 whitespace-nowrap">Resting</button>
                        <button onclick="setBenchFilter('unpaid')" id="filter-unpaid" class="px-3 py-1 rounded-full bg-slate-100 text-slate-600 whitespace-nowrap">Unpaid</button>
                        <button onclick="setBenchFilter('all')" id="filter-all" class="px-3 py-1 rounded-full bg-slate-100 text-slate-600 whitespace-nowrap">All DB</button>

                            <button id="btn-lb-session" onclick="setLeaderboardMode('session')" class="px-3 py-1.5 rounded text-slate-500 hover:text-slate-700 transition-colors">Today's Session</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-full text-sm">
                            <thead id="leaderboardHead">
                                <!-- Populated by JS -->
                            </thead>
                            <tbody id="leaderboardBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around items-center pb-safe z-50 h-16 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('dashboard')" id="mob-nav-dashboard" class="flex flex-col items-center justify-center w-1/4 h-full text-indigo-600">
            <span class="text-xl mb-0.5">📋</span><span class="text-[10px] font-bold">Play</span>
        </button>
        <button onclick="switchTab('history')" id="mob-nav-history" class="flex flex-col items-center justify-center w-1/4 h-full text-slate-400">

    <!-- Edit Player Modal Overlay -->
    <div id="editModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-sm text-slate-800">✏️ Edit Player</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Name</label>
                    <input type="text" id="editPlayerName" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Rating</label>
                    <input type="number" id="editPlayerRating" step="0.001" min="2.0" max="8.0" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono font-medium">
                </div>
                <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-100">
                    <input type="checkbox" id="editPlayerVerified" class="w-4 h-4 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer">
                    <label for="editPlayerVerified" class="text-sm font-medium text-slate-700 cursor-pointer flex items-center gap-1">
                        Verified DUPR Player 🔵
                    </label>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-200 transition-colors">Cancel</button>
                <button onclick="saveEditModal()" class="px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ZERO DEPENDENCY & RESILIENT STORAGE ENGINE ---
        let players = []; 
        let historicalMatches = []; 
        let sessionMatches = [];
        let activeCourts = [];
        let numCourts = 3;
        let matchType = 'doubles';
        let playSequence = 1;
        let benchFilter = 'checked';
        let activeTab = 'dashboard';
        let leaderboardMode = 'global';
        let editingPlayerId = null;

        const STARTING_RATING = 3.500;
        const BASE_K = 0.1; 
        const VERIFIED_K = 0.02; 
        const WEIGHTS = { WAIT_INDEX: 1.8, REPEAT_PARTNER: 12.0, REPEAT_OPP: 4.0, RATING_GAP: 6.5 };

        function esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        function uid() { return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`; }

        let saveTimer = null;
        function saveData(immediate = false) {
            const persist = () => {
                const payload = {
                    version: 2, players, historicalMatches, sessionMatches, activeCourts, numCourts, matchType, playSequence,
                    sessionName: document.getElementById('sessionName').value,
                    sessionDate: document.getElementById('sessionDate').value,
                    sessionLocation: document.getElementById('sessionLocation').value
                };
                try { localStorage.setItem('paddleRankData', JSON.stringify(payload)); }
                catch(e) { console.error(e); alert('Storage error. Backup data immediately via CSV.'); }
            };
            clearTimeout(saveTimer);
            if (immediate) persist(); else saveTimer = setTimeout(persist, 250);
        }

        function loadData() {
            const raw = localStorage.getItem('paddleRankData');
            const dEl = document.getElementById('sessionDate');
            if(!raw) { if(dEl) dEl.valueAsDate = new Date(); syncCourtSlots(); return; }
            try {
                const d = JSON.parse(raw);
                players = d.players || [];
                historicalMatches = d.historicalMatches || [];
                sessionMatches = d.sessionMatches || [];
                activeCourts = d.activeCourts || [];
                numCourts = d.numCourts || 3;
                matchType = d.matchType || 'doubles';
                playSequence = d.playSequence || 1;
                
                if(d.sessionName) document.getElementById('sessionName').value = d.sessionName;
                if(d.sessionLocation) document.getElementById('sessionLocation').value = d.sessionLocation;
                if(d.sessionDate && dEl) dEl.value = d.sessionDate; else if(dEl) dEl.valueAsDate = new Date();
                
                // Set default player state to 'ready'
                players.forEach(p => { if (!p.sessionState || p.sessionState === 'out') p.sessionState = 'ready'; });
                
                setMatchType(matchType);
                document.getElementById('courtCountDisplay').textContent = numCourts;
                syncCourtSlots();
            } catch(e) {
                localStorage.setItem(`paddleRankData_backup_${Date.now()}`, raw);
                if(dEl) dEl.valueAsDate = new Date();
                syncCourtSlots();
            }
        }

        // --- 2. MATCHMAKING & CONTINUOUS ROTATION ENGINE ---
        function syncCourtSlots() {
            while (activeCourts.length < numCourts) activeCourts.push({ courtNum: activeCourts.length + 1, match: null });
            if (activeCourts.length > numCourts) {
                for (let i = activeCourts.length - 1; i >= numCourts; i--) {
                    if (!activeCourts[i].match) activeCourts.splice(i, 1);
                }
            }
        }

        function getPlayingPlayerIds(excludeCourtNum = null) {
            const ids = new Set();
            for (const c of activeCourts) {
                if (c.match && c.courtNum !== excludeCourtNum) {
                    c.match.t1Ids.forEach(id => ids.add(id));
                    c.match.t2Ids.forEach(id => ids.add(id));
                }
            }
            return ids;
        }

        function buildSessionHistoryMatrices() {
            const pMap = new Map(), oMap = new Map();
            const key = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
            const inc = (map, a, b) => map.set(key(a, b), (map.get(key(a, b)) || 0) + 1);

            const relevant = [...sessionMatches, ...activeCourts.map(c => c.match).filter(Boolean)];
            for (const m of relevant) {
                if (m.t1Ids.length === 2) inc(pMap, m.t1Ids[0], m.t1Ids[1]);
                if (m.t2Ids.length === 2) inc(pMap, m.t2Ids[0], m.t2Ids[1]);
                for (const p1 of m.t1Ids) for (const p2 of m.t2Ids) inc(oMap, p1, p2);
            }
            return { getP: (a,b) => pMap.get(key(a,b))||0, getO: (a,b) => oMap.get(key(a,b))||0 };
        }

        function selectOptimalMatch(excludedIds, virtualGames = new Map(), virtualWait = new Map()) {
            const size = matchType === 'doubles' ? 4 : 2;
            const eligible = players.filter(p => p.sessionState === 'ready' && !excludedIds.has(p.id));
            if (eligible.length < size) return null;

            const ranked = [...eligible].sort((a, b) => {
                const gA = (a.sessionMatches || 0) + (virtualGames.get(a.id) || 0);
                const gB = (b.sessionMatches || 0) + (virtualGames.get(b.id) || 0);
                if (gA !== gB) return gA - gB;
                const wA = virtualWait.get(a.id) ?? (a.lastPlayedOrder || 0);
                const wB = virtualWait.get(b.id) ?? (b.lastPlayedOrder || 0);
                if (wA !== wB) return wA - wB;
                return Math.random() - 0.5;
            });

            const pool = ranked.slice(0, size === 4 ? 8 : 6);
            const { getP, getO } = buildSessionHistoryMatrices();
            let best = null, minCost = Infinity;

            const evaluate = (t1, t2, wCost) => {
                let sCost = 0;
                if (t1.length === 2) sCost += WEIGHTS.REPEAT_PARTNER * getP(t1[0].id, t1[1].id);
                if (t2.length === 2) sCost += WEIGHTS.REPEAT_PARTNER * getP(t2[0].id, t2[1].id);
